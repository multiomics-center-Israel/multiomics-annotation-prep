name: Build model-organism annotation

# Manually-dispatched pipeline for an organism with a public reference
# annotation (Ensembl, UniProt or a VEuPathDB site). It downloads GO -- and
# optionally KEGG -- annotation directly (no KAAS/Trinotate), producing the
# gene-based tables the RNA pipeline reads from annotation_dir (and, for
# veupathdb, GO GMTs for the proteomics pipeline's gmt_file), and publishes them
# as a dated Release.
#
#   source: ensembl  -> Ensembl/BioMart, keyed on Ensembl gene IDs (needs a
#                        dataset; pick the right mart/host for the division).
#   source: uniprot  -> UniProt REST, keyed on UniProt accessions (needs a
#                        taxon id).
#   source: veupathdb -> the organism's GO GAF from a VEuPathDB site (GiardiaDB,
#                        PlasmoDB, ToxoDB, ...), keyed on the site's gene ids,
#                        or re-keyed via id_map_url (e.g. an NCBI feature table
#                        -> protein accessions). dataset = site/Organism[@release],
#                        e.g. giardiadb/GintestinalisAssemblageAWB@68.
#
# Output tables (GO2gene_{BP,MF,CC}.tab + GO2name_{BP,MF,CC}.tab, hierarchy-
# expanded; KEGG_pathway2gene/2name.tab when kegg_org is set) drop straight into
# modes.rna.enrichment.annotation_dir. Gene IDs are the source's own ID space --
# they must match your counts.

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Annotation source"
        type: choice
        options: [ensembl, uniprot, veupathdb]
        default: ensembl
      label:
        description: "Short label for the release tag/stem (e.g. athaliana, cre)"
        type: string
        required: true
      dataset:
        description: "[ensembl] BioMart dataset, e.g. athaliana_eg_gene | [veupathdb] site/Organism[@release], e.g. giardiadb/GintestinalisAssemblageAWB (required for both)"
        type: string
        default: ""
      mart:
        description: "[ensembl] BioMart mart: ensembl | plants_mart | protists_mart | fungi_mart | metazoa_mart"
        type: string
        default: "ensembl"
      host:
        description: "[ensembl] BioMart host (empty = www.ensembl.org; e.g. https://plants.ensembl.org)"
        type: string
        default: ""
      taxon_id:
        description: "[uniprot] NCBI taxon id, e.g. 3702 (required for uniprot)"
        type: string
        default: ""
      reviewed:
        description: "[uniprot] Swiss-Prot (reviewed) only"
        type: boolean
        default: true
      id_map_url:
        description: "[veupathdb] Optional URL of an NCBI *_feature_table.txt.gz or a 2-col TSV to re-key gene ids (e.g. locus tag -> protein accession)"
        type: string
        default: ""
      kegg_org:
        description: "[ensembl/uniprot] Optional KEGG organism code -> ALSO build KEGG_pathway tables (e.g. ath, cre)"
        type: string
        default: ""
      date:
        description: "Release date stamp YYYYMMDD (empty = today, UTC)"
        type: string
        default: ""

permissions:
  contents: write   # required to create Releases

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SOURCE: ${{ inputs.source }}
      LABEL: ${{ inputs.label }}
      DATASET: ${{ inputs.dataset }}
      MART: ${{ inputs.mart }}
      HOST: ${{ inputs.host }}
      TAXON_ID: ${{ inputs.taxon_id }}
      REVIEWED: ${{ inputs.reviewed }}
      ID_MAP_URL: ${{ inputs.id_map_url }}
      KEGG_ORG: ${{ inputs.kegg_org }}
      IN_DATE: ${{ inputs.date }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests pyyaml
          # ensembl path now queries BioMart directly over REST -- no pybiomart

      - name: Validate inputs
        run: |
          if ! printf '%s' "$LABEL" | grep -Eq '^[A-Za-z0-9_-]+$'; then
            echo "::error::label must be letters/digits/underscore/hyphen (got '$LABEL')."
            exit 1
          fi
          if [ -n "$IN_DATE" ] && ! printf '%s' "$IN_DATE" | grep -Eq '^[0-9]{8}$'; then
            echo "::error::date must be YYYYMMDD (got '$IN_DATE')."
            exit 1
          fi
          if [ "$SOURCE" = "ensembl" ] && [ -z "$DATASET" ]; then
            echo "::error::dataset is required for source=ensembl."
            exit 1
          fi
          if [ "$SOURCE" = "uniprot" ] && [ -z "$TAXON_ID" ]; then
            echo "::error::taxon_id is required for source=uniprot."
            exit 1
          fi
          if [ "$SOURCE" = "veupathdb" ]; then
            if ! printf '%s' "$DATASET" | grep -Eq '^[A-Za-z]+/[A-Za-z0-9_.-]+(@[A-Za-z0-9]+)?$'; then
              echo "::error::dataset for source=veupathdb must be site/Organism[@release], e.g. giardiadb/GintestinalisAssemblageAWB (got '$DATASET')."
              exit 1
            fi
            if [ -n "$KEGG_ORG" ]; then
              echo "::warning::kegg_org is ignored for source=veupathdb (GO only)."
            fi
          fi
          if [ -n "$ID_MAP_URL" ] && [ "$SOURCE" != "veupathdb" ]; then
            echo "::warning::id_map_url is only used by source=veupathdb; ignoring it."
          fi

      - name: Build annotation tables
        run: |
          out="annotation_out"
          mkdir -p "$out"
          if [ "$SOURCE" = "ensembl" ]; then
            args=(--dataset "$DATASET" --mart "$MART" --out "$out" --cache data)
            [ -n "$HOST" ]     && args+=(--host "$HOST")
            [ -n "$KEGG_ORG" ] && args+=(--kegg-org "$KEGG_ORG")
            python scripts/run_ensembl.py "${args[@]}"
          elif [ "$SOURCE" = "uniprot" ]; then
            args=(--taxon-id "$TAXON_ID" --out "$out" --cache data)
            [ "$REVIEWED" = "false" ] && args+=(--no-reviewed)
            [ -n "$KEGG_ORG" ]        && args+=(--kegg-org "$KEGG_ORG")
            python scripts/run_uniprot.py "${args[@]}"
          else
            site="${DATASET%%/*}"
            rest="${DATASET#*/}"
            organism="${rest%%@*}"
            release="CURRENT"
            [ "$rest" != "$organism" ] && release="${rest#*@}"
            args=(--site "$(printf '%s' "$site" | tr '[:upper:]' '[:lower:]')"
                  --organism "$organism" --release "$release"
                  --out "$out" --cache data)
            [ -n "$ID_MAP_URL" ] && args+=(--id-map "$ID_MAP_URL")
            python scripts/run_veupathdb.py "${args[@]}"
          fi
          echo "== built files =="
          ls -la "$out"
          ls "$out"/*.tab
          [ "$SOURCE" = "veupathdb" ] && ls "$out"/*.gmt
          true

      - name: Publish Release
        run: |
          date="$IN_DATE"
          [ -z "$date" ] && date="$(date -u +%Y%m%d)"
          tag="${LABEL}_${SOURCE}_annot_${date}"
          out="annotation_out"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists -- bump the date input (artifacts are immutable)."
            exit 1
          fi

          zip="${tag}.zip"
          ( cd "$out" && zip -r "../$zip" . )

          # .gmt files exist only for some sources; attach whatever was built.
          shopt -s nullglob
          ( cd "$out" && files=(*.tab *.gmt) && printf '%s\n' "${files[@]}" ) > files.txt
          mapfile -t built < files.txt

          # sha256 checksums so a project can pin {url, sha256} for reproducible,
          # verified fetches (the zip for annotation_ref, each .tab/.gmt individually).
          ( sha256sum "$zip"; cd "$out" && sha256sum "${built[@]}" ) > SHA256SUMS.txt
          echo "== SHA256SUMS =="; cat SHA256SUMS.txt

          gh release create "$tag" "$zip" "${built[@]/#/$out/}" SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "$tag" \
            --notes "GO (and KEGG when kegg_org is set) annotation tables (annotation_dir) from ${SOURCE} for '${LABEL}'.
          RNA: download ${zip} and unzip into your project's annotation_dir, then point
          modes.rna.enrichment.annotation_dir at that folder.
          Proteomics (veupathdb): point modes.proteomics.pathway.gmt_file at the GO_*.gmt files.
          For a reproducible, verified fetch, pin {url, sha256} from SHA256SUMS.txt
          (the zip for annotation_ref; the .gmt/.tab individually).
          NOTE: gene IDs are the ${SOURCE} ID space -- they must match your counts' gene IDs."
          echo "Published $tag"
