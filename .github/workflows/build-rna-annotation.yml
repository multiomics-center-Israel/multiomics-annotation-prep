name: Build gene annotation (RNA / proteomics)

# The file keeps its historical name (build-rna-annotation.yml): GitHub ties a
# workflow's identity and run history to its path, and a workflow_dispatch can
# only be started from a branch when a file at that path exists on the default
# branch. Only the display name above changed.

# Manually-dispatched pipeline that turns a project's committed annotation
# inputs into the gene-based enrichment files multiomic-core reads, and
# publishes them as a dated, immutable GitHub Release:
#
#   RNA        -> modes.rna.enrichment.annotation_dir   (the .tab tables)
#   proteomics -> modes.proteomics.pathway.gmt_file     (the .gmt files)
#
# Both are built from the same inputs; only the release tag and notes differ.
# These files are keyed on the project's own IDs (genes, transcripts or
# proteins), so the workflow is fed the project's files rather than an
# organism code:
#
#   1. Upload the inputs to  annotation_inputs/<project>/  (Add file ->
#      Upload files on GitHub). Filenames must be exactly:
#        query.ko.txt      KAAS output (id<TAB>KO)              -> KEGG
#        trinotate_go.txt  per-id GO table (id<TAB>GO ids)      -> GO
#        <name>.gaf[.gz]   one GO Annotation File, any name (e.g.
#                          GiardiaDB-71_..._GO.gaf) -- keep the downloaded
#                          name, it carries the source release   -> GO
#        id_map.txt[.gz]   optional, re-keys GAF ids: a 2-col TSV or an
#                          NCBI *_feature_table.txt(.gz)
#      At least one of query.ko.txt / trinotate_go.txt / a GAF is needed;
#      trinotate_go.txt and a GAF are alternatives (not both).
#   2. Run this workflow with that <project> name and the omics it is for.
#      To re-key GAF ids onto NCBI protein accessions, prefer the
#      ncbi_assembly input over committing id_map: the runner downloads the
#      assembly's public feature table itself and records its URL + sha256.
#
# It builds on a GitHub-hosted runner (open internet -> rest.kegg.jp,
# purl.obolibrary.org, ftp.ncbi.nlm.nih.gov reachable). GAFs from VEuPathDB
# sites need a logged-in browser to download, which is why they are committed
# rather than fetched. GO_provenance.json (GAF builds) and the release notes
# record the inputs' sources and checksums, the commit and the run.

on:
  workflow_dispatch:
    inputs:
      project:
        description: "Folder name under annotation_inputs/ holding the input files"
        type: string
        required: true
      omics:
        description: "Which pipeline the files are for (sets the release tag + notes)"
        type: choice
        options: [rna, proteomics]
        default: rna
      ncbi_assembly:
        description: "[GAF] Optional NCBI assembly accession (e.g. GCA_000002435.2): fetch its feature table to re-key GAF ids to protein accessions"
        type: string
        default: ""
      date:
        description: "Release date stamp YYYYMMDD (empty = today, UTC)"
        type: string
        default: ""
      strip_isoform:
        description: "[rna] Strip _iN isoform suffixes from KAAS ids to gene level (ignored for proteomics)"
        type: boolean
        default: true

permissions:
  contents: write   # required to create Releases

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PROJECT: ${{ inputs.project }}
      OMICS: ${{ inputs.omics }}
      NCBI_ASSEMBLY: ${{ inputs.ncbi_assembly }}
      IN_DATE: ${{ inputs.date }}
      STRIP: ${{ inputs.strip_isoform }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests pyyaml

      - name: Validate inputs
        run: |
          # project is used to build a path; restrict to safe characters.
          if ! printf '%s' "$PROJECT" | grep -Eq '^[A-Za-z0-9_-]+$'; then
            echo "::error::project must be letters/digits/underscore/hyphen only (got '$PROJECT')."
            exit 1
          fi
          if [ -n "$IN_DATE" ] && ! printf '%s' "$IN_DATE" | grep -Eq '^[0-9]{8}$'; then
            echo "::error::date must be YYYYMMDD (got '$IN_DATE')."
            exit 1
          fi
          in_dir="annotation_inputs/$PROJECT"
          if [ ! -d "$in_dir" ]; then
            echo "::error::Folder $in_dir not found. Upload query.ko.txt, trinotate_go.txt and/or a .gaf there first (Add file -> Upload files)."
            exit 1
          fi
          # The GAF keeps its downloaded name (it carries the source release),
          # so find it by extension and hand its path to the later steps.
          shopt -s nullglob
          gafs=("$in_dir"/*.gaf "$in_dir"/*.gaf.gz)
          if [ "${#gafs[@]}" -gt 1 ]; then
            echo "::error::$in_dir has more than one GAF (${gafs[*]}) -- keep one."
            exit 1
          fi
          GAF="${gafs[0]:-}"
          echo "GAF=$GAF" >> "$GITHUB_ENV"
          if [ ! -f "$in_dir/query.ko.txt" ] && [ ! -f "$in_dir/trinotate_go.txt" ] && [ -z "$GAF" ]; then
            echo "::error::$in_dir has none of query.ko.txt, trinotate_go.txt, a .gaf file."
            exit 1
          fi
          if [ -f "$in_dir/trinotate_go.txt" ] && [ -n "$GAF" ]; then
            echo "::error::$in_dir has both trinotate_go.txt and a GAF -- keep only the GO source you want."
            exit 1
          fi
          if [ -f "$in_dir/id_map.txt" ] && [ -f "$in_dir/id_map.txt.gz" ]; then
            echo "::error::$in_dir has both id_map.txt and id_map.txt.gz -- keep one."
            exit 1
          fi
          has_map=false
          { [ -f "$in_dir/id_map.txt" ] || [ -f "$in_dir/id_map.txt.gz" ]; } && has_map=true
          if [ "$has_map" = "true" ] && [ -z "$GAF" ]; then
            echo "::warning::id_map is only applied to a GAF; there is no .gaf in $in_dir, so it is ignored."
          fi
          if [ -n "$NCBI_ASSEMBLY" ]; then
            if ! printf '%s' "$NCBI_ASSEMBLY" | grep -Eq '^GC[AF]_[0-9]{9}\.[0-9]+$'; then
              echo "::error::ncbi_assembly must be a versioned accession like GCA_000002435.2 (got '$NCBI_ASSEMBLY')."
              exit 1
            fi
            if [ -z "$GAF" ]; then
              echo "::error::ncbi_assembly re-keys GAF ids, but $in_dir has no .gaf file."
              exit 1
            fi
            if [ "$has_map" = "true" ]; then
              echo "::error::Both ncbi_assembly and an id_map file are set -- use one."
              exit 1
            fi
          fi

      - name: Build annotation files
        run: |
          in_dir="annotation_inputs/$PROJECT"
          out="annotation_out"
          mkdir -p "$out"

          if [ -f "$in_dir/query.ko.txt" ]; then
            extra=""
            # Protein ids never carry Trinity isoform suffixes; stripping is RNA-only.
            if [ "$OMICS" = "proteomics" ] || [ "$STRIP" = "false" ]; then
              extra="--no-strip-isoform"
            fi
            python scripts/run_kegg_nonmodel.py --kaas "$in_dir/query.ko.txt" \
              --out "$out" --cache data $extra
          else
            echo "::warning::no query.ko.txt in $in_dir -- skipping KEGG"
          fi

          if [ -f "$in_dir/trinotate_go.txt" ]; then
            python scripts/run_go.py --go-table "$in_dir/trinotate_go.txt" \
              --out "$out" --cache data
          elif [ -n "$GAF" ]; then
            map_args=()
            for m in "$in_dir/id_map.txt" "$in_dir/id_map.txt.gz"; do
              [ -f "$m" ] && map_args=(--id-map "$m")
            done
            [ -n "$NCBI_ASSEMBLY" ] && map_args=(--ncbi-assembly "$NCBI_ASSEMBLY")
            python scripts/run_gaf.py --gaf "$GAF" "${map_args[@]}" \
              --out "$out" --cache data
          else
            echo "::warning::no trinotate_go.txt or .gaf in $in_dir -- skipping GO"
          fi

          echo "== built files =="
          ls -la "$out"

      - name: Publish Release
        run: |
          date="$IN_DATE"
          [ -z "$date" ] && date="$(date -u +%Y%m%d)"
          # rna keeps its historical tag prefix so existing release names stay stable.
          if [ "$OMICS" = "proteomics" ]; then prefix="prot_annot"; else prefix="rna_annot"; fi
          tag="${prefix}_${PROJECT}_${date}"
          out="annotation_out"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists -- bump the date input (artifacts are immutable)."
            exit 1
          fi

          shopt -s nullglob
          ( cd "$out" && files=(*.tab *.gmt *.json) && printf '%s\n' "${files[@]}" ) > files.txt
          mapfile -t built < files.txt
          if [ "${#built[@]}" -eq 0 ]; then
            echo "::error::No .tab/.gmt files were built -- nothing to publish."
            exit 1
          fi

          zip="${tag}.zip"
          ( cd "$out" && zip -r "../$zip" . )

          # sha256 checksums so a project can pin {url, sha256} for reproducible,
          # verified fetches (the zip for annotation_ref, each file individually).
          ( sha256sum "$zip"; cd "$out" && sha256sum "${built[@]}" ) > SHA256SUMS.txt
          echo "== SHA256SUMS =="; cat SHA256SUMS.txt

          if [ "$OMICS" = "proteomics" ]; then
            usage="Proteomics: download the GO_*.gmt (and KEGG_pathway.gmt) files into your project
          and list them under modes.proteomics.pathway.gmt_file. Set
          modes.proteomics.annotation.skip_annotation: true when the ids are the raw
          Protein.Group ids (no remapping to gene symbols)."
          else
            usage="RNA: download ${zip} and unzip into your RNA project's annotation_dir, then point
          modes.rna.enrichment.annotation_dir at that folder."
          fi

          # Provenance in the notes: what was built from what, by which commit/run.
          in_dir="annotation_inputs/$PROJECT"
          {
            echo "Gene-based enrichment annotation (${OMICS}) for project '${PROJECT}'."
            echo
            echo "${usage}"
            echo
            echo "## Provenance"
            echo "- Built by commit ${GITHUB_SHA} in run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Inputs (annotation_inputs/${PROJECT}/, sha256):"
            for f in "$in_dir"/query.ko.txt "$in_dir"/trinotate_go.txt "$GAF" \
                     "$in_dir"/id_map.txt "$in_dir"/id_map.txt.gz; do
              [ -n "$f" ] && [ -f "$f" ] && echo "  - $(basename "$f"): $(sha256sum "$f" | cut -d' ' -f1)"
            done; true
            if [ -n "$NCBI_ASSEMBLY" ]; then
              echo "- GAF ids re-keyed with the NCBI feature table of ${NCBI_ASSEMBLY} (URL + sha256 in GO_provenance.json)"
            fi
            if [ -n "$GAF" ]; then
              echo "- $(basename "$GAF") header:"
              echo '```'
              zgrep -m 20 '^!' "$GAF" || true
              echo '```'
            fi
            echo
            echo "For a reproducible, verified fetch, pin {url, sha256} from SHA256SUMS.txt."
            echo "NOTE: these files are keyed on the input ids -- they must match the ids in your data."
          } > notes.md

          gh release create "$tag" "$zip" "${built[@]/#/$out/}" SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "$tag" \
            --notes-file notes.md
          echo "Published $tag"
