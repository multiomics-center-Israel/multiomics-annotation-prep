name: Delete releases (maintenance)

# Manually delete one or more Releases (and their git tags). The publish
# workflows here create immutable, dated Releases on purpose, so this guarded
# maintenance job is the intended way to take a superseded or test build down.
# Guard: you must type DELETE in the confirm box for it to run.

on:
  workflow_dispatch:
    inputs:
      tags:
        description: "Release tag(s) to delete, space- or comma-separated"
        type: string
        required: true
      confirm:
        description: "Type DELETE to confirm"
        type: string
        required: true

permissions:
  contents: write   # required to delete Releases and tags

jobs:
  delete:
    runs-on: ubuntu-latest
    env:
      TAGS: ${{ inputs.tags }}
      CONFIRM: ${{ inputs.confirm }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check confirmation
        run: |
          if [ "$CONFIRM" != "DELETE" ]; then
            echo "::error::confirm must be exactly DELETE (got '$CONFIRM')."
            exit 1
          fi

      - name: Delete releases and tags
        run: |
          # normalize commas to spaces, then delete each tag's release + tag
          for tag in $(printf '%s' "$TAGS" | tr ',' ' '); do
            [ -z "$tag" ] && continue
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
              echo "Deleted release + tag: $tag"
            else
              echo "::warning::No such release: $tag (skipping)"
            fi
          done
