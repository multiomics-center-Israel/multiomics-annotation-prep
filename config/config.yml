# Configuration for multiomic-annotation-prep.
# Enable the modules you need and fill in the organism-specific inputs.
# Run:  python scripts/run_all.py --config config/config.yml

out_dir:   results     # where the .tab files are written
cache_dir: data        # download cache (re-used across runs)
refresh:   false       # true = re-download all remote files
expand_go: true        # expand GO annotations to parental terms

modules:

  # --- primary path: non-model organism (transcriptome + KAAS) ------------
  kegg_nonmodel:
    enabled: true
    kaas:  examples/query.ko.txt      # KAAS output (gene<TAB>KO)
    strip_isoform: true               # collapse _iN isoforms to gene level

  go_nonmodel:
    enabled: true
    go_table: examples/trinotate_go.txt   # per-gene GO table (Trinotate style)

  # --- model organism with a genome in Ensembl ----------------------------
  ensembl:
    enabled: false
    dataset:  mmusculus_gene_ensembl
    mart:     ensembl
    host:     null                    # e.g. https://may2024.archive.ensembl.org
    kegg_org: mmu                     # KEGG organism code (null to skip KEGG)
    id_source: ensembl                # id space for KEGG mapping

  # --- proteome in UniProt (proteomics) -----------------------------------
  uniprot:
    enabled: false
    taxon_id: 10090
    reviewed: true                    # Swiss-Prot only
    kegg_org: mmu                     # null to skip KEGG

  # --- mummichog metabolic model (compound-centric; for `mummichog -n`) ----
  # NEW output type, independent of the gene-set modules above. Needs the
  # scoped optional deps:  pip install -r requirements-mummichog.txt
  mummichog_model:
    enabled: false
    source: kegg_org                  # kegg_org (built) | kaas (planned seam)
    kegg_code: cre                    # KEGG organism code to build from
    model_organism: "Chlamydomonas reinhardtii"   # what the model IS
    model_kegg_code: cre              # KEGG code recorded for the model
    target_organism: "Coelastrella sp."   # biology it stands in for (null if same)
    source_version: null              # override; else auto-detected from KEGG
    date: null                        # YYYYMMDD; else today (UTC)
    validate: false                   # run `mummichog -n` smoke test (needs mummichog)
    # kaas: examples/query.ko.txt     # (future) KO list for --source kaas
